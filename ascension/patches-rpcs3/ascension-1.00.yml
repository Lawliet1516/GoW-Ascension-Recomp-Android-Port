# RPCS3-format patches for God of War: Ascension 1.00 (BCES01741), the version
# this port is built from. RPCS3's own patch file only has PPU patches for the
# 1.04 and 1.12 updates; patches ported to 1.00 go here, under this
# executable's hash (tools\rpcs3_patch.py info prints it).
#
# Ported from RPCS3's 1.04 patches (PPU-3a63ecc6e9b81a984d2fe0a481febc3e26b57810,
# GOWA.SELF from the official 1.04 update, decrypted and hash-checked). Each
# 1.04 address was located in 1.00 by matching the surrounding instructions
# with immediates and branch targets masked (a unique match of 21 to 131
# instructions each), constant pools by their exact float sequences, and the
# data addresses through the instructions that reference them. The 1.04
# address is in the comment of every line.
Version: 1.2

Anchors:
  gowa_100_title: &gowa_100_title
    "God of War: Ascension":
      BCES01741: [ 01.00 ]

PPU-5842e8bc5420b6d10eee4cf24243e7d8647e477d:
  "Unlock FPS":
    Games: *gowa_100_title
    Author: "ZEROx, illusion (1.04); ported to 1.00"
    Notes: "Unlocks the internal timestep: the game runs at the right speed at any frame rate. Target 60 fps. Port of RPCS3's 1.04 patch, with two fixes for slower PCs: the level loader gets its original time per call again (3.25 ms instead of 0.2 ms: faster loading), and one frame never moves the game more than 66.7 ms, as on the PS3."
    Patch Version: 2.1
    Patch:
      - [ bef32, 0x00377694, 1000 ]        # 0x0039e284: 59.94 Hz refresh constant
      - [ bef32, 0x002b3c3c, 6673 ]        # 0x002cae2c: largest step x100 (400.0 = 4 vblanks); RPCS3 uses 10000 (100 ms), 6673 = 66.7 ms = the original's 4 vblanks (PC port 2.1)
      - [ bef32, 0x0081af14, 60 ]          # 0x0083b2cc: target FPS, main float
      - [ be32, 0x002b3be8, 0x60000000 ]   # 0x002cadd8: keep the store from overwriting it
      - [ be16, 0x002ae1b6, 0x913c ]       # 0x002c537e: 1000.0f gameplay speed scaling
      - [ be16, 0x002b3cd6, 0x913c ]       # 0x002caec6: 1000.0f sync
      - [ be16, 0x002b3d7e, 0x913c ]       # 0x002caf6e: 1000.0f sync
      - [ be16, 0x003c838a, 0x913c ]       # 0x003ef71a: 1000.0f video playback speed scaling
      # PC port 2.1: the ms unit also shrank the WAD loader's per-call time budget (ticks_per_unit / 5) from 3.34 to 0.2 ms
      - [ be32, 0x003CA134, 0x1F63000D ]   # WAD loader state machine (func 0x3C9FBC) budget = ticks_per_unit/5: mulhdu r27,r4,r3 -> mulli r27,r3,13; then >>2 = 3.25 ms (orig 7F641812)
      - [ be32, 0x0003CD38, 0x1C63000D ]   # WAD init loop (func 0x3C834) budget: mulhdu r3,r4,r3 -> mulli r3,r3,13; then >>2 = 3.25 ms (orig 7C641812)
