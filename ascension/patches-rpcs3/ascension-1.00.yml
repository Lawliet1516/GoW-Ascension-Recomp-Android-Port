  "Cheat: Unlock All":
    Games: *gowa_100_title
    Author: "GoW Ascension PC port"
    Notes: "Unlocked while ticked: Titan difficulty, New Game+ and its costumes, the extras videos, and the 10 artifacts with known cheats (switch them on in New Game+). The unlocks are not written to your save: untick it and they are locked again (games you start or save meanwhile are kept). Chapters you have not reached stay locked (there is no save data for them)."
